plugins {
    id 'com.android.application' version '8.13.2'
}
android {
    namespace 'com.pnwcomputers.vault'
    compileSdk {
        version = release(36) {
            it.minorApiLevel = 1
        }
    }
    defaultConfig {
        applicationId 'com.pnwcomputers.vault'
        minSdk 36
        targetSdk 36
        versionCode 1
        versionName '0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
